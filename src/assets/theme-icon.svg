  <!-- Sol -->
            <g class="sun">
                <!-- Centro del sol -->
                <circle cx="50" cy="50" r="20" fill="#747474"/>
                
                <!-- Rayos del sol (8 rayos) -->
                <g fill="#747474">
                    <!-- Rayo arriba -->
                    <rect x="47" y="10" width="6" height="15" rx="3"/>
                    <!-- Rayo arriba-derecha -->
                    <rect x="70" y="18" width="6" height="15" rx="3" transform="rotate(45 73 25.5)"/>
                    <!-- Rayo derecha -->
                    <rect x="75" y="47" width="15" height="6" rx="3"/>
                    <!-- Rayo abajo-derecha -->
                    <rect x="70" y="67" width="6" height="15" rx="3" transform="rotate(-45 73 74.5)"/>
                    <!-- Rayo abajo -->
                    <rect x="47" y="75" width="6" height="15" rx="3"/>
                    <!-- Rayo abajo-izquierda -->
                    <rect x="24" y="67" width="6" height="15" rx="3" transform="rotate(45 27 74.5)"/>
                    <!-- Rayo izquierda -->
                    <rect x="10" y="47" width="15" height="6" rx="3"/>
                    <!-- Rayo arriba-izquierda -->
                    <rect x="24" y="18" width="6" height="15" rx="3" transform="rotate(-45 27 25.5)"/>
                </g>
            </g>
</svg>



